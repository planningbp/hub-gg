<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GG · Hub de Informações</title>
<meta name="description" content="Principais canais, sistemas, materiais e informações do GG — Gente & Gestão · Planning.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230AE18C'/%3E%3Ctext x='16' y='21' font-family='Calibri,Arial' font-size='13' font-weight='700' text-anchor='middle' fill='%23000'%3EGG%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#0AE18C;--green-dark:#059669;--green-50:#F0FFF8;--black:#000;--white:#fff;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
  --amber:#F59E0B;--amber-50:#FFFBEB;--red:#EF4444;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px -1px rgba(0,0,0,.06);
  --shadow-hover:0 12px 28px -8px rgba(0,0,0,.12),0 6px 10px -6px rgba(0,0,0,.05);
  --shadow-xl:0 24px 48px -16px rgba(0,0,0,.25);
  --font:Calibri,"Segoe UI",Carlito,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--g50);color:var(--g900);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:1em;height:1em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:1120px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.shell{padding:0 24px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .shell{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:38px;height:38px;border-radius:11px;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand small{display:block;font-size:12px;color:rgba(255,255,255,.5)}
@media(max-width:400px){.brand-txt{display:none}}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .12s,background .15s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.card:focus-visible,.feat:focus-visible,.chip:focus-visible,.acc-btn:focus-visible,.row:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn .i{font-size:17px}
.btn-green{background:var(--green);color:#000}.btn-green:hover{filter:brightness(.95)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-light{background:var(--g100);color:var(--g700)}.btn-light:hover{background:var(--g200)}
.btn-line{background:#fff;border:1px solid var(--g200);color:var(--g700)}.btn-line:hover{background:var(--g50)}
.btn-dark{background:#000;color:#fff}.btn-dark:hover{background:#222}
.btn[disabled]{opacity:.45;pointer-events:none}
@media(max-width:639px){.hide-sm{display:none}}

/* Hero */
.hero{background:#000;position:relative;overflow:hidden;
  background-image:radial-gradient(60rem 24rem at 50% -6rem,rgba(10,225,140,.2),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px}
.hero .shell{padding-top:44px;padding-bottom:132px;text-align:center}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--green);font-size:12px;font-weight:700;letter-spacing:.2em}
.hero h1{margin-top:14px;color:#fff;font-size:34px;line-height:1.1;letter-spacing:-.02em}
@media(min-width:640px){.hero h1{font-size:50px}}
.hero p{margin:12px auto 0;max-width:560px;color:rgba(255,255,255,.62);font-size:17px}
@media(min-width:640px){.hero p{font-size:19px}}
.search{position:relative;max-width:640px;margin:30px auto 0}
.search .i{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--g400);pointer-events:none}
.search input{width:100%;height:58px;border-radius:18px;border:0;background:#fff;padding:0 52px 0 54px;font-size:17px;box-shadow:var(--shadow-xl);outline:none;transition:box-shadow .15s}
.search input:focus{box-shadow:var(--shadow-xl),0 0 0 4px rgba(10,225,140,.35)}
.search input::placeholder{color:var(--g400)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;display:none;align-items:center;justify-content:center;color:var(--g400)}
.search .clear:hover{background:var(--g100);color:var(--g700)}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:1px solid var(--g200);border-radius:6px;font:12px var(--font);color:var(--g400);display:flex;align-items:center;justify-content:center}
@media(max-width:639px){.search kbd{display:none}}
.chips{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;background:rgba(255,255,255,.05);color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.1);transition:.15s}
.chip:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(10,225,140,.5)}

main.shell{position:relative;margin-top:-92px;padding-bottom:64px}
.no-feat main.shell{margin-top:-40px}
.no-feat .hero .shell{padding-bottom:84px}
.no-feat:not(.searching) .hero .shell{padding-bottom:56px}
.no-feat:not(.searching) main.shell{margin-top:40px}

/* Featured */
.feat-head{display:flex;align-items:center;gap:8px;margin:0 2px 14px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.feat-head .i{color:var(--green);fill:var(--green);font-size:16px}
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:56px}
.feat-grid.odd>.feat:first-child{grid-column:span 2}
@media(min-width:640px){.feat-grid{grid-template-columns:repeat(3,1fr);gap:16px}.feat-grid.odd>.feat:first-child{grid-column:auto}}
@media(min-width:1024px){.feat-grid.n4{grid-template-columns:repeat(4,1fr)}.feat-grid.n5,.feat-grid.n6{grid-template-columns:repeat(5,1fr)}}
.feat{position:relative;display:flex;flex-direction:column;min-height:176px;padding:16px;border-radius:18px;background:#fff;border:1px solid var(--g200);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
@media(min-width:640px){.feat{min-height:208px;padding:22px}}
.feat::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--green);opacity:0;transition:opacity .2s}
.feat:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:rgba(10,225,140,.6)}
.feat:hover::before{opacity:1}
.feat:active{transform:translateY(0) scale(.99)}
.feat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.feat-ic{width:44px;height:44px;border-radius:14px;background:#000;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .2s}
@media(min-width:640px){.feat-ic{width:50px;height:50px;font-size:24px}}
.feat:hover .feat-ic{transform:scale(1.06)}
.feat-arrow{width:32px;height:32px;border-radius:99px;background:var(--g100);color:var(--g500);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.feat:hover .feat-arrow{background:var(--green);color:#000}
.feat h3{font-size:16px;line-height:1.25;margin-bottom:4px}
@media(min-width:640px){.feat h3{font-size:18px}}
.feat p{font-size:13.5px;color:var(--g500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:640px){.feat p{font-size:15px}}
.cta{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--green-dark)}
.cta .arr{transition:transform .2s}.feat:hover .cta .arr,.card:hover .cta .arr{transform:translateX(3px)}

/* Results bar */
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--g200);border-radius:14px;padding:16px 20px;margin-bottom:32px;box-shadow:var(--shadow);font-size:15px;color:var(--g600)}
.res strong{color:var(--g900)}
.link-btn{font-weight:700;font-size:14px;color:var(--green-dark)}.link-btn:hover{text-decoration:underline}

/* Sections */
.sec{margin-bottom:56px;scroll-margin-top:80px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--g200)}
.sec-title{display:flex;align-items:center;gap:12px}
.sec-ic{width:42px;height:42px;border-radius:12px;background:#000;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sec h2{font-size:21px;line-height:1.15}
.sec-title p{font-size:14.5px;color:var(--g500)}
.count{flex-shrink:0;padding:2px 10px;border-radius:99px;background:var(--g100);color:var(--g600);font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;align-items:flex-start;gap:14px;padding:16px;min-height:98px;border-radius:14px;background:#fff;border:1px solid var(--g200);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:rgba(10,225,140,.55)}
.card:active{transform:translateY(0) scale(.99)}
.card-ic{width:42px;height:42px;border-radius:12px;background:var(--green-50);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:.2s}
.card:hover .card-ic{background:var(--green);color:#000}
.card h3{font-size:16px;line-height:1.25}
.card p{font-size:14px;color:var(--g500);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cta{padding-top:8px;font-size:13.5px}
.soon{opacity:.6;cursor:default}
.soon:hover{transform:none;box-shadow:none;border-color:var(--g200)}
.soon .card-ic,.soon .feat-ic{background:var(--g100);color:var(--g400)}
.soon .cta{color:var(--g400)}

/* Accordion */
.accs{display:flex;flex-direction:column;gap:12px}
.grid+.accs{margin-top:14px}
.acc{background:#fff;border:1px solid var(--g200);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
.acc.open{box-shadow:var(--shadow);border-color:var(--g300)}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;text-align:left;transition:background .15s}
.acc-btn:hover{background:var(--g50)}
.acc-ic{width:38px;height:38px;border-radius:10px;background:var(--green-50);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.acc-btn b{display:block;font-size:16px}
.acc-btn small{display:block;font-size:13px;color:var(--g500)}
.acc-btn .chev{margin-left:auto;color:var(--g400);font-size:18px;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc-panel{display:none;border-top:1px solid var(--g100);animation:fade .2s}
.acc.open .acc-panel{display:block}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px;transition:background .15s}
.row+.row{border-top:1px solid var(--g100)}
.row:hover{background:rgba(240,255,248,.7)}
.row-ic{width:36px;height:36px;border-radius:10px;background:var(--g50);color:var(--g500);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:.15s}
.row:hover .row-ic{background:var(--green-50);color:var(--green-dark)}
.row-txt{flex:1;min-width:0}
.row-txt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-txt small{display:block;font-size:13px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-cta{font-size:13.5px;font-weight:700;color:var(--green-dark);display:flex;align-items:center;gap:6px;flex-shrink:0}
@media(max-width:639px){.row-cta span{display:none}}

.empty{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:52px 24px;text-align:center}
.empty .ic{width:48px;height:48px;border-radius:12px;background:var(--g100);color:var(--g400);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
.empty b{display:block;font-size:16px}.empty p{font-size:14px;color:var(--g500);max-width:380px;margin:4px auto 0}

footer{margin-top:72px;padding-top:28px;border-top:1px solid var(--g200);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--g400)}
footer nav{display:flex;gap:18px}
footer a,footer button{display:inline-flex;align-items:center;gap:5px;color:var(--g400);font-size:13.5px}
footer a:hover,footer button:hover{color:var(--green-dark)}

/* Modal / drawer */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);animation:fade .2s}
@media(min-width:640px){.ov{align-items:center;padding:16px}}
.modal{position:relative;width:100%;max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--shadow-xl);animation:up .25s}
@media(min-width:640px){.modal{border-radius:22px;max-width:640px}}
.modal.sm{max-width:380px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--g100)}
.modal-h h2{font-size:18px}
.x{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--g400);font-size:18px}.x:hover{background:var(--g100);color:var(--g700)}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--g100);display:flex;justify-content:flex-end;gap:8px}
.qr{text-align:center;padding:28px 24px}
.qr .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark)}
.qr h2{font-size:19px;margin:4px 0 18px}
.qr-box{width:228px;height:228px;margin:0 auto;border:1px solid var(--g200);border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center}
.qr-box canvas,.qr-box img{width:100%;height:100%}
.qr small{display:block;margin-top:14px;font-size:12.5px;color:var(--g500);word-break:break-all}
.qr-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:80;background:#000;color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-xl)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--green)}

/* Editor */
.ed-bar{position:sticky;top:64px;z-index:35;background:var(--amber-50);border-bottom:1px solid #FDE68A;color:#92400E;font-size:14px}
.ed-bar .shell{min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.ed-bar .grow{flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
.ed-bar .btn{height:36px;font-size:13.5px}
.ed-tools{display:none;gap:4px;margin-left:auto}
.editing .ed-tools{display:flex}
.editing .card,.editing .feat,.editing .row{cursor:default}
.it-tools{display:none}
.editing .it-tools{display:flex;gap:2px;flex-shrink:0;align-self:center}
.editing .card{flex-wrap:wrap}
.editing .card-tools{width:100%;justify-content:flex-end;border-top:1px solid var(--g100);padding-top:6px;margin-top:2px}
.tb{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g500);font-size:15px}
.tb:hover{background:var(--g100);color:var(--g900)}
.tb.on{color:var(--amber)}.tb.on svg{fill:var(--amber)}
.tb.del:hover{background:#FEF2F2;color:var(--red)}
.tb[disabled]{opacity:.25;pointer-events:none}
.hidden-item{opacity:.45}
.hidden-item h3,.hidden-item b{text-decoration:line-through}
.add-btn{display:none;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--g300);border-radius:14px;min-height:60px;color:var(--g500);font-weight:700;font-size:14.5px;transition:.15s}
.add-btn:hover{border-color:var(--green);color:var(--green-dark);background:var(--green-50)}
.editing .add-btn{display:flex}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--g100);color:var(--g600);vertical-align:middle;margin-left:4px}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:13px;font-weight:700;color:var(--g700);margin-bottom:5px}
.f small{display:block;font-size:12px;color:var(--g400);margin-top:4px}
.in{width:100%;padding:10px 12px;border:1px solid var(--g200);border-radius:10px;background:#fff;font-size:15px;outline:none;transition:.15s}
.in:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(10,225,140,.2)}
textarea.in{min-height:72px;resize:vertical}
.cols{display:grid;gap:0 14px}
@media(min-width:560px){.cols{grid-template-columns:1fr 1fr}}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
@media(min-width:560px){.icons{grid-template-columns:repeat(12,1fr)}}
.icons button{height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g500);font-size:17px}
.icons button:hover{background:var(--g100)}
.icons button.sel{background:var(--green);color:#000}
.tg{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--g700);margin-right:22px;margin-bottom:6px}
.tg i{position:relative;width:40px;height:24px;border-radius:99px;background:var(--g300);transition:.15s;flex-shrink:0}
.tg i::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.tg[aria-checked=true] i{background:var(--green)}
.tg[aria-checked=true] i::after{transform:translateX(16px)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--g100);border-radius:12px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;padding:8px 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--g500);white-space:nowrap}
.tabs button.act{background:#fff;color:var(--g900);box-shadow:var(--shadow)}
.list{border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px}
.li+.li{border-top:1px solid var(--g100)}
.li .ttl{flex:1;min-width:0}
.li .ttl b{display:block;font-size:15px}
.li .ttl small{display:block;font-size:12.5px;color:var(--g400)}
.note{background:var(--g50);border:1px solid var(--g200);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--g600);margin-bottom:14px}
.note ol{padding-left:18px}.note li{margin:3px 0}
.ok{background:#ECFDF5;color:#065F46;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.err{background:#FEF2F2;color:#B91C1C;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.warn{color:#B45309}

@keyframes fade{from{opacity:0}to{opacity:1}}

<script>
(function(){
"use strict";
var PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
var REPO = {owner:"planningbp", repo:"hub-gg", branch:"main", path:"public/hub.html"};
var PORTAL = "./";               // Hub GG completo (mesmo site)
var DRAFT_KEY = "hub-gg-html-draft";
var TOKEN_KEY = "hub-gg-gh-token";
var ICON_CHOICES = ["Link2","Globe","LayoutDashboard","Target","GitBranch","ClipboardList","FolderOpen","FileText","BookOpen","Megaphone","CalendarDays","Rocket","Info","ShieldCheck","Users","UserPlus","Award","GraduationCap","Heart","Gift","Wallet","Clock","Mail","Phone","MessageCircle","MessageSquare","Headset","LifeBuoy","Instagram","Linkedin","Youtube","Facebook","Cloud","Video","Monitor","Zap","Star","HelpCircle","SearchCheck","Palmtree","TrendingUp","Building2","MapPin","Newspaper","PlayCircle","Download","Folder","BookOpenCheck","Briefcase","Calculator","Coffee","Lightbulb","Smile","Sparkles"];

var $ = function(s, r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var ic = function(n){ var id = document.getElementById("i-"+n) ? n : "Link2"; return '<svg class="i"><use href="#i-'+id+'"/></svg>'; };
var norm = function(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); };
var nowIso = function(){ return new Date().toISOString(); };
var byOrder = function(a,b){ return (a.ordem-b.ordem) || a.titulo.localeCompare(b.titulo,"pt-BR"); };
var slug = function(s){ return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48) || "item"; };
var uid = function(base, ids){ var s=slug(base), n=2, r=s; while(ids.indexOf(r)>=0){ r=s+"-"+(n++); } return r; };
var clone = function(o){ return JSON.parse(JSON.stringify(o)); };

function store(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ---------------- Dados ---------------- */
var PUBLISHED = normalize(JSON.parse(document.getElementById("hub-data").textContent));
var DATA = PUBLISHED;
var editing = false;
var query = "";

function normalize(raw){
  var now = nowIso();
  raw = raw || {};
  var cats = (raw.categorias||[]).map(function(c,i){ return {
    id:String(c.id||("cat-"+(i+1))), titulo:String(c.titulo||"Sem título"), descricao:String(c.descricao||""),
    icone:String(c.icone||"Folder"), ordem:Number(c.ordem)||i+1, ativo:c.ativo!==false, exibicao:c.exibicao==="lista"?"lista":"cards" }; });
  var its = (raw.itens||[]).map(function(t,i){ return {
    id:String(t.id||("item-"+(i+1))), titulo:String(t.titulo||"Sem título"), descricao:String(t.descricao||""), url:String(t.url||""),
    categoria:String(t.categoria||""), icone:String(t.icone||"Link2"), destaque:t.destaque===true, ordem:Number(t.ordem)||i+1,
    ativo:t.ativo!==false, grupo:String(t.grupo||""), rotuloAcao:String(t.rotuloAcao||""), tags:Array.isArray(t.tags)?t.tags.map(String):[],
    criadoEm:String(t.criadoEm||now), atualizadoEm:String(t.atualizadoEm||now) }; });
  var c = raw.config||{};
  return { versao:Number(raw.versao)||1, atualizadoEm:String(raw.atualizadoEm||now),
    config:{ sigla:String(c.sigla||"GG"), titulo:String(c.titulo||"Hub de Informações"), descricao:String(c.descricao||""),
      tituloDestaques:String(c.tituloDestaques||"Mais acessados"), rodape:String(c.rodape||"Gente & Gestão · Planning") },
    categorias:cats, itens:its };
}

/* ---------------- Links ---------------- */
function resolve(url){
  var u = (url||"").trim();
  if(!u || u==="#") return {kind:"vazio", href:""};
  if(/^mailto:/i.test(u)) return {kind:"email", href:u};
  if(/^tel:/i.test(u)) return {kind:"tel", href:u};
  if(/^https?:\/\//i.test(u)) return {kind:"externo", href:u};
  if(u.charAt(0)==="/") return {kind:"interno", href:PORTAL+"#"+u};
  return {kind:"arquivo", href:"./"+u.replace(/^\.?\//,"")};
}
var KIND_LABEL = {interno:"Acessar", externo:"Acessar", arquivo:"Baixar", email:"Enviar e-mail", tel:"Ligar", vazio:"Em breve"};
var KIND_ICON = {interno:"ArrowRight", externo:"ArrowUpRight", arquivo:"Download", email:"Mail", tel:"Phone", vazio:"Clock"};
var KIND_NAME = {interno:"Página do Hub GG", externo:"Site externo (abre em nova aba)", arquivo:"Arquivo para download", email:"E-mail", tel:"Telefone", vazio:"Sem link — aparece como “Em breve”"};
function label(t){ var k=resolve(t.url).kind; return k==="vazio" ? "Em breve" : (t.rotuloAcao || KIND_LABEL[k]); }
function linkAttrs(t){
  var r = resolve(t.url);
  if(r.kind==="vazio" || editing) return {tag:"div", attrs:(r.kind==="vazio"?' aria-disabled="true" title="Em breve"':'')};
  var a = ' href="'+esc(r.href)+'"';
  if(r.kind==="externo") a += ' target="_blank" rel="noopener noreferrer"';
  if(r.kind==="arquivo") a += ' download';
  return {tag:"a", attrs:a};
}

function publicUrl(){ return location.href.split("#")[0].split("?")[0]; }

/* ---------------- Render ---------------- */
function render(){
  var d = DATA, cfg = d.config;
  document.title = cfg.sigla + " · " + cfg.titulo;
  $("#logo").textContent = cfg.sigla; $("#hSigla").textContent = cfg.sigla;
  $("#hTitle").textContent = cfg.titulo; $("#hDesc").textContent = cfg.descricao;
  document.body.classList.toggle("editing", editing);

  var cats = d.categorias.slice().sort(byOrder).filter(function(c){ return editing || c.ativo; });
  var catById = {}; cats.forEach(function(c){ catById[c.id]=c; });
  var visible = d.itens.filter(function(t){ return catById[t.categoria] && (editing || t.ativo); });
  var terms = norm(query).split(/\s+/).filter(Boolean);
  var searching = terms.length>0;
  var matched = visible.filter(function(t){
    if(!searching) return true;
    var c = catById[t.categoria];
    var hay = norm([t.titulo,t.descricao,t.grupo,(t.tags||[]).join(" "),c.titulo,c.descricao].join(" "));
    return terms.every(function(x){ return hay.indexOf(x)>=0; });
  });

  var html = "";
  // Destaques (definidos abaixo)
  var feat = visible.filter(function(t){ return t.destaque && t.ativo; })
    .sort(function(a,b){ return (catById[a.categoria].ordem-catById[b.categoria].ordem) || byOrder(a,b); }).slice(0,6);
  document.body.classList.toggle("no-feat", searching || !feat.length);
  document.body.classList.toggle("searching", searching);
  if(!searching && feat.length){
    html += '<div class="feat-head">'+ic("Star")+'<span>'+esc(cfg.tituloDestaques)+'</span></div>';
    html += '<div class="feat-grid n'+feat.length+(feat.length%2?' odd':'')+'">';
    feat.forEach(function(t,i){
      var L = linkAttrs(t), k = resolve(t.url).kind;
      html += '<'+L.tag+' class="feat rise'+(k==="vazio"?" soon":"")+'" style="animation-delay:'+(i*.05)+'s"'+L.attrs+'>'+
        '<div class="feat-top"><span class="feat-ic">'+ic(t.icone)+'</span><span class="feat-arrow">'+ic(KIND_ICON[k])+'</span></div>'+
        '<h3>'+esc(t.titulo)+'</h3><p>'+esc(t.descricao)+'</p>'+
        '<span class="cta">'+esc(label(t))+' <span class="arr">→</span></span></'+L.tag+'>';
    });
    html += '</div>';
  }

  if(searching){
    html += '<div class="res"><span>'+(matched.length? '<strong>'+matched.length+'</strong> '+(matched.length===1?'resultado':'resultados')+' para “'+esc(query)+'”' : 'Nenhum resultado para “'+esc(query)+'”')+'</span><button class="link-btn" data-act="clear">Limpar</button></div>';
    if(!matched.length) html += '<div class="empty"><div class="ic">'+ic("SearchX")+'</div><b>Não encontramos o que você procura</b><p>Tente outra palavra, como “férias”, “POP” ou “formulário”, ou fale com o GG pelos canais de atendimento.</p></div>';
  }

  var chips = "";
  cats.forEach(function(c){
    var items = matched.filter(function(t){ return t.categoria===c.id; }).sort(byOrder);
    if(!items.length && !editing) return;
    if(!items.length && searching) return;
    chips += '<button class="chip" data-go="'+esc(c.id)+'">'+ic(c.icone)+esc(c.titulo)+'</button>';
    var cards = c.exibicao==="lista" ? [] : items.filter(function(t){ return !t.grupo; });
    var groups = [], gmap = {};
    items.forEach(function(t){
      var g = c.exibicao==="lista" ? c.titulo : t.grupo;
      if(!g) return;
      if(!gmap[g]){ gmap[g]={nome:g,itens:[]}; groups.push(gmap[g]); }
      gmap[g].itens.push(t);
    });
    html += '<section class="sec'+(c.ativo?'':' hidden-item')+'" id="sec-'+esc(c.id)+'"><div class="sec-head"><div class="sec-title"><span class="sec-ic">'+ic(c.icone)+'</span><div><h2>'+esc(c.titulo)+'</h2>'+(c.descricao?'<p>'+esc(c.descricao)+'</p>':'')+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:6px"><span class="count">'+items.length+'</span>'+
      '<span class="it-tools">'+tools("cat",c,cats)+'</span></div></div>';
    if(cards.length){
      html += '<div class="grid">';
      cards.forEach(function(t){
        var L = linkAttrs(t), k = resolve(t.url).kind;
        html += '<'+L.tag+' class="card'+(k==="vazio"?" soon":"")+(t.ativo?"":" hidden-item")+'"'+L.attrs+'><span class="card-ic">'+ic(t.icone)+'</span>'+
          '<div style="flex:1;min-width:0"><h3>'+esc(t.titulo)+(editing&&t.destaque?'<span class="badge">★ destaque</span>':'')+'</h3><p>'+esc(t.descricao)+'</p>'+
          '<span class="cta">'+ic(KIND_ICON[k])+esc(label(t))+'</span></div>'+
          '<span class="it-tools card-tools">'+tools("item",t,items)+'</span></'+L.tag+'>';
      });
      html += '</div>';
    }
    if(groups.length){
      html += '<div class="accs">';
      groups.forEach(function(g){
        var open = searching || editing;
        html += '<div class="acc'+(open?' open':'')+'"><button class="acc-btn" aria-expanded="'+open+'"><span class="acc-ic">'+ic(c.exibicao==="lista"?c.icone:"FolderOpen")+'</span>'+
          '<span><b>'+esc(g.nome)+'</b><small>'+g.itens.length+' '+(g.itens.length===1?'item':'itens')+'</small></span>'+
          '<span class="chev">'+ic("ChevronDown")+'</span></button><div class="acc-panel">';
        g.itens.forEach(function(t){
          var L = linkAttrs(t), k = resolve(t.url).kind;
          html += '<'+L.tag+' class="row'+(t.ativo?"":" hidden-item")+'"'+L.attrs+'><span class="row-ic">'+ic(t.icone)+'</span>'+
            '<span class="row-txt"><b>'+esc(t.titulo)+'</b>'+(t.descricao?'<small>'+esc(t.descricao)+'</small>':'')+'</span>'+
            '<span class="row-cta"><span>'+esc(label(t))+'</span>'+ic(KIND_ICON[k])+'</span>'+
            '<span class="it-tools">'+tools("item",t,items)+'</span></'+L.tag+'>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '<button class="add-btn" style="margin-top:12px;width:100%" data-act="add" data-cat="'+esc(c.id)+'">'+ic("Plus")+'Adicionar item em “'+esc(c.titulo)+'”</button>';
    html += '</section>';
  });
  if(editing) html += '<button class="add-btn" style="width:100%;margin-bottom:40px" data-act="addcat">'+ic("FolderPlus")+'Nova categoria</button>';

  html += '<footer><span>'+esc(cfg.rodape)+'</span><nav><a href="'+PORTAL+'">'+ic("ArrowLeft")+'Hub GG completo</a>'+
    '<button data-act="edit">'+ic("Pencil")+(editing?'Sair da edição':'Editar')+'</button></nav></footer>';

  $("#main").innerHTML = html;
  $("#chips").innerHTML = (!searching && (chips.match(/class="chip"/g)||[]).length > 1) ? chips : "";
  renderEdBar();
}

function tools(type, o, list){
  if(!editing) return "";
  var sorted = list.slice().sort(byOrder), i = sorted.indexOf(o);
  if(type==="cat") sorted = DATA.categorias.slice().sort(byOrder), i = sorted.indexOf(o);
  var t = '<button class="tb" title="Subir" data-act="up" data-type="'+type+'" data-id="'+esc(o.id)+'"'+(i<=0?' disabled':'')+'>'+ic("ArrowUp")+'</button>'+
    '<button class="tb" title="Descer" data-act="down" data-type="'+type+'" data-id="'+esc(o.id)+'"'+(i>=sorted.length-1?' disabled':'')+'>'+ic("ArrowDown")+'</button>';
  if(type==="item") t += '<button class="tb'+(o.destaque?' on':'')+'" title="'+(o.destaque?'Remover dos destaques':'Destacar em Mais acessados')+'" data-act="star" data-id="'+esc(o.id)+'">'+ic("Star")+'</button>';
  t += '<button class="tb" title="'+(o.ativo?'Ocultar':'Exibir')+'" data-act="toggle" data-type="'+type+'" data-id="'+esc(o.id)+'">'+ic(o.ativo?"Eye":"EyeOff")+'</button>'+
    '<button class="tb" title="Editar" data-act="editone" data-type="'+type+'" data-id="'+esc(o.id)+'">'+ic("Pencil")+'</button>'+
    '<button class="tb del" title="Excluir" data-act="del" data-type="'+type+'" data-id="'+esc(o.id)+'">'+ic("Trash2")+'</button>';
  return t;
}

/* ---------------- Interações ---------------- */
var qEl = $("#q");
qEl.addEventListener("input", function(){ query = qEl.value; $("#qClear").style.display = query?"flex":"none"; $("#qKbd").style.display = query?"none":""; render(); });
$("#qClear").addEventListener("click", function(){ qEl.value=""; qEl.dispatchEvent(new Event("input")); qEl.focus(); });
document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName||"");
  if(e.key==="/" && tag!=="INPUT" && tag!=="TEXTAREA" && tag!=="SELECT"){ e.preventDefault(); qEl.focus(); }
  if(e.key==="Escape") closeLayer();
});
$("#chips").addEventListener("click", function(e){
  var b = e.target.closest("[data-go]"); if(!b) return;
  var el = document.getElementById("sec-"+b.getAttribute("data-go"));
  if(el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 80, behavior:"smooth"});
});

$("#main").addEventListener("click", function(e){
  var acc = e.target.closest(".acc-btn");
  if(acc && !e.target.closest(".tb")){ var p = acc.parentNode; p.classList.toggle("open"); acc.setAttribute("aria-expanded", p.classList.contains("open")); return; }
  var b = e.target.closest("[data-act]"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), type = b.getAttribute("data-type");
  if(act==="clear"){ qEl.value=""; qEl.dispatchEvent(new Event("input")); return; }
  if(act==="edit"){ editing ? exitEdit() : enterEdit(); return; }
  if(act==="add"){ itemForm(null, b.getAttribute("data-cat")); return; }
  if(act==="addcat"){ catForm(null); return; }
  var coll = type==="cat" ? DATA.categorias : DATA.itens;
  var o = coll.filter(function(x){ return x.id===id; })[0]; if(!o) return;
  if(act==="up"||act==="down"){
    var list = type==="cat" ? DATA.categorias.slice() : DATA.itens.filter(function(x){ return x.categoria===o.categoria; });
    list.sort(byOrder); var i = list.indexOf(o), j = act==="up"?i-1:i+1;
    if(j<0||j>=list.length) return;
    list.splice(i,1); list.splice(j,0,o); list.forEach(function(x,k){ x.ordem=k+1; });
    change(); return;
  }
  if(act==="star"){ o.destaque=!o.destaque; o.atualizadoEm=nowIso(); change(); return; }
  if(act==="toggle"){ o.ativo=!o.ativo; if(type==="item") o.atualizadoEm=nowIso(); change(); return; }
  if(act==="editone"){ type==="cat" ? catForm(o) : itemForm(o); return; }
  if(act==="del"){
    if(type==="cat" && DATA.itens.some(function(x){ return x.categoria===id; })){ toast("Mova ou exclua os itens desta categoria antes de excluí-la."); return; }
    confirmBox("Excluir “"+o.titulo+"”?", "Isso remove o "+(type==="cat"?"categoria":"item")+" do Hub após você publicar.", function(){
      if(type==="cat") DATA.categorias = DATA.categorias.filter(function(x){ return x.id!==id; });
      else DATA.itens = DATA.itens.filter(function(x){ return x.id!==id; });
      change();
    });
  }
});

/* ---------------- Compartilhar ---------------- */
function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(function(){ return true; }, function(){ return legacy(); });
  return Promise.resolve(legacy());
  function legacy(){ var a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} a.remove(); return ok; }
}
function copyLink(){ copyText(publicUrl()).then(function(ok){ toast(ok?"Link copiado!":"Não foi possível copiar o link."); }); }
$("#bCopy").addEventListener("click", copyLink);
$("#bShare").addEventListener("click", function(){
  var d = {title:document.title, text:DATA.config.descricao, url:publicUrl()};
  if(navigator.share){ navigator.share(d).catch(function(){}); } else copyLink();
});
$("#bQr").addEventListener("click", function(){
  openLayer('<div class="ov"><div class="modal sm" role="dialog" aria-modal="true" aria-label="QR Code"><button class="x" data-close style="position:absolute;top:12px;right:12px" aria-label="Fechar">'+ic("X")+'</button>'+
    '<div class="qr"><div class="eyebrow">Acesse pelo celular</div><h2>'+esc(document.title)+'</h2><div class="qr-box" id="qrBox">Gerando…</div><small>'+esc(publicUrl())+'</small>'+
    '<div class="qr-btns"><a class="btn btn-green" id="qrDl" download="qrcode-hub-gg.png">'+ic("Download")+'Baixar PNG</a><button class="btn btn-light" id="qrCopy">'+ic("Copy")+'Copiar link</button></div></div></div></div>');
  window.QRCode.toDataURL(publicUrl(), {width:720, margin:2, errorCorrectionLevel:"M", color:{dark:"#000000", light:"#FFFFFF"}}).then(function(u){
    $("#qrBox").innerHTML = '<img alt="QR Code do Hub" src="'+u+'">'; $("#qrDl").href = u;
  });
  $("#qrCopy").addEventListener("click", copyLink);
});

/* ---------------- Camadas (modais) ---------------- */
function openLayer(h){ $("#layer").innerHTML = h; document.body.style.overflow="hidden";
  var ov = $("#layer .ov"); ov.addEventListener("click", function(e){ if(e.target===ov || e.target.closest("[data-close]")) closeLayer(); });
  var f = $("#layer input, #layer textarea"); if(f) setTimeout(function(){ f.focus(); }, 50); }
function closeLayer(){ $("#layer").innerHTML=""; document.body.style.overflow=""; }
var tt; function toast(m){ var t=$("#toast"); t.innerHTML = ic("CheckCircle2")+esc(m); t.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("show"); }, 2600); }
function confirmBox(title, text, ok){
  openLayer('<div class="ov"><div class="modal sm"><div class="modal-b"><h2 style="font-size:18px;margin-bottom:6px">'+esc(title)+'</h2><p style="color:var(--g500);font-size:15px">'+esc(text)+'</p></div>'+
    '<div class="modal-f"><button class="btn btn-line" data-close>Cancelar</button><button class="btn btn-dark" id="cOk" style="background:var(--red)">Excluir</button></div></div></div>');
  $("#cOk").addEventListener("click", function(){ closeLayer(); ok(); });
}

/* ---------------- Modo edição ---------------- */
function dirty(){ return JSON.stringify(strip(DATA)) !== JSON.stringify(strip(PUBLISHED)); }
function strip(d){ return {c:d.config, k:d.categorias, i:d.itens}; }
function change(){ DATA.atualizadoEm = nowIso(); store(DRAFT_KEY, dirty()? JSON.stringify(DATA) : null); render(); }
function enterEdit(){
  var draft = load(DRAFT_KEY);
  DATA = draft ? normalize(JSON.parse(draft)) : clone(PUBLISHED);
  editing = true; history.replaceState(null, "", "#editar"); render(); window.scrollTo({top:0, behavior:"smooth"});
}
function exitEdit(){ editing = false; DATA = PUBLISHED; history.replaceState(null, "", location.pathname+location.search); render(); }
function renderEdBar(){
  if(!editing){ $("#edBar").innerHTML=""; return; }
  var n = DATA.itens.filter(function(t){ return t.destaque && t.ativo; }).length;
  $("#edBar").innerHTML = '<div class="ed-bar"><div class="shell"><span class="grow">'+ic("Pencil")+'<span><b>Modo edição.</b> '+
    (dirty()? 'Você tem alterações <b>não publicadas</b> (salvas neste navegador).' : 'Nenhuma alteração pendente.')+
    ' <span class="'+(n<3||n>5?'warn':'')+'">'+n+' em destaque (ideal: 3 a 5).</span></span></span>'+
    '<button class="btn btn-line" id="eCfg">'+ic("Settings2")+'Cabeçalho</button>'+
    (dirty()? '<button class="btn btn-line" id="eDiscard">'+ic("RotateCcw")+'Descartar</button>':'')+
    '<button class="btn btn-dark" id="ePub">'+ic("UploadCloud")+'Publicar</button>'+
    '<button class="btn btn-line" id="eExit">Sair</button></div></div>';
  $("#eExit").onclick = exitEdit;
  $("#eCfg").onclick = cfgForm;
  $("#ePub").onclick = publishForm;
  var d = $("#eDiscard"); if(d) d.onclick = function(){ confirmBox("Descartar alterações?", "Volta para a versão publicada.", function(){ store(DRAFT_KEY,null); DATA=clone(PUBLISHED); render(); }); var b=$("#cOk"); if(b) b.textContent="Descartar"; };
}

function field(lbl, inner, hint){ return '<label class="f"><span>'+lbl+'</span>'+inner+(hint?'<small>'+hint+'</small>':'')+'</label>'; }
function toggleHtml(id, on, lbl){ return '<button type="button" class="tg" role="switch" id="'+id+'" aria-checked="'+on+'"><i></i>'+lbl+'</button>'; }
function bindToggles(){ document.querySelectorAll("#layer .tg").forEach(function(b){ b.onclick=function(){ b.setAttribute("aria-checked", b.getAttribute("aria-checked")!=="true"); }; }); }
function iconPicker(cur){
  return '<div style="display:flex;gap:8px;align-items:center"><span class="card-ic" id="fIcPrev">'+ic(cur)+'</span><select class="in" id="fIc">'+
    ICON_CHOICES.map(function(n){ return '<option'+(n===cur?' selected':'')+'>'+n+'</option>'; }).join("")+'</select></div>'+
    '<div class="icons" id="fIcons">'+ICON_CHOICES.map(function(n){ return '<button type="button" title="'+n+'" data-ic="'+n+'"'+(n===cur?' class="sel"':'')+'>'+ic(n)+'</button>'; }).join("")+'</div>';
}
function bindIcons(){
  var sel = $("#fIc");
  function set(n){ sel.value=n; $("#fIcPrev").innerHTML=ic(n); document.querySelectorAll("#fIcons button").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-ic")===n); }); }
  sel.onchange = function(){ set(sel.value); };
  $("#fIcons").onclick = function(e){ var b=e.target.closest("[data-ic]"); if(b) set(b.getAttribute("data-ic")); };
}

function itemForm(item, catId){
  var isNew = !item;
  var t = item ? item : {id:"",titulo:"",descricao:"",url:"",categoria:catId||DATA.categorias.slice().sort(byOrder)[0].id,icone:"Link2",destaque:false,ativo:true,grupo:"",rotuloAcao:"",tags:[],criadoEm:nowIso()};
  var cats = DATA.categorias.slice().sort(byOrder);
  var groups = []; DATA.itens.forEach(function(x){ if(x.grupo && groups.indexOf(x.grupo)<0) groups.push(x.grupo); });
  openLayer('<div class="ov"><form class="modal" id="fItem"><div class="modal-h"><h2>'+(isNew?'Novo item':'Editar item')+'</h2><button type="button" class="x" data-close aria-label="Fechar">'+ic("X")+'</button></div><div class="modal-b">'+
    field("Título *", '<input class="in" id="fT" required value="'+esc(t.titulo)+'" placeholder="Ex.: Portal do GG">')+
    field("Descrição", '<textarea class="in" id="fD" placeholder="Uma frase curta explicando o que a pessoa encontra.">'+esc(t.descricao)+'</textarea>')+
    field("Link", '<input class="in" id="fU" value="'+esc(t.url)+'" placeholder="https://…">', '<span id="fUk"></span> Use <b>https://…</b>, uma página do Hub GG (<b>/processos</b>), um arquivo da pasta docs (<b>docs/arquivo.pdf</b>) ou <b>mailto:email@…</b>. Deixe vazio para “Em breve”.')+
    '<div class="cols">'+field("Categoria *", '<select class="in" id="fC">'+cats.map(function(c){ return '<option value="'+esc(c.id)+'"'+(c.id===t.categoria?' selected':'')+'>'+esc(c.titulo)+'</option>'; }).join("")+'</select>')+
    field("Grupo (accordion)", '<input class="in" id="fG" list="fGl" value="'+esc(t.grupo)+'" placeholder="Opcional — ex.: Políticas"><datalist id="fGl">'+groups.map(function(g){ return '<option value="'+esc(g)+'">'; }).join("")+'</datalist>', "Itens com o mesmo grupo ficam juntos numa lista expansível.")+'</div>'+
    field("Ícone", iconPicker(t.icone))+
    '<div class="cols">'+field("Texto do botão", '<input class="in" id="fR" value="'+esc(t.rotuloAcao)+'" placeholder="Acessar">', "Opcional. Padrão: Acessar / Baixar / Enviar e-mail.")+
    field("Palavras-chave da busca", '<input class="in" id="fK" value="'+esc((t.tags||[]).join(", "))+'" placeholder="férias, benefícios">', "Separadas por vírgula.")+'</div>'+
    '<div>'+toggleHtml("fS", t.destaque, "Mostrar em “Mais acessados”")+toggleHtml("fA", t.ativo, "Visível no Hub")+'</div>'+
    '</div><div class="modal-f"><button type="button" class="btn btn-line" data-close>Cancelar</button><button class="btn btn-dark" type="submit">'+ic("Check")+'Salvar item</button></div></form></div>');
  bindToggles(); bindIcons();
  var fU = $("#fU"); function kind(){ $("#fUk").innerHTML = 'Detectado: <b>'+KIND_NAME[resolve(fU.value).kind]+'</b>.'; } fU.oninput = kind; kind();
  $("#fItem").onsubmit = function(e){
    e.preventDefault();
    var titulo = $("#fT").value.trim(); if(!titulo) return;
    var o = item || {criadoEm:nowIso()};
    var oldCat = o.categoria;
    o.titulo = titulo; o.descricao = $("#fD").value.trim(); o.url = fU.value.trim(); o.categoria = $("#fC").value;
    o.icone = $("#fIc").value; o.grupo = $("#fG").value.trim(); o.rotuloAcao = $("#fR").value.trim();
    o.tags = $("#fK").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    o.destaque = $("#fS").getAttribute("aria-checked")==="true"; o.ativo = $("#fA").getAttribute("aria-checked")==="true";
    o.atualizadoEm = nowIso();
    if(isNew || oldCat!==o.categoria) o.ordem = DATA.itens.filter(function(x){ return x.categoria===o.categoria && x!==o; }).reduce(function(m,x){ return Math.max(m,x.ordem); },0)+1;
    if(isNew){ o.id = uid(titulo, DATA.itens.map(function(x){ return x.id; })); DATA.itens.push(o); }
    closeLayer(); change(); toast(isNew?"Item adicionado.":"Item atualizado.");
  };
}

function catForm(cat){
  var isNew = !cat;
  var c = cat || {id:"",titulo:"",descricao:"",icone:"Folder",ativo:true,exibicao:"cards"};
  openLayer('<div class="ov"><form class="modal" id="fCat"><div class="modal-h"><h2>'+(isNew?'Nova categoria':'Editar categoria')+'</h2><button type="button" class="x" data-close aria-label="Fechar">'+ic("X")+'</button></div><div class="modal-b">'+
    field("Título *", '<input class="in" id="cT" required value="'+esc(c.titulo)+'">')+
    field("Descrição", '<input class="in" id="cD" value="'+esc(c.descricao)+'">')+
    field("Exibição", '<select class="in" id="cE"><option value="cards"'+(c.exibicao!=="lista"?' selected':'')+'>Cards (padrão)</option><option value="lista"'+(c.exibicao==="lista"?' selected':'')+'>Lista compacta em accordion (bom para muitos itens)</option></select>')+
    field("Ícone", iconPicker(c.icone))+toggleHtml("cA", c.ativo, "Visível no Hub")+
    '</div><div class="modal-f"><button type="button" class="btn btn-line" data-close>Cancelar</button><button class="btn btn-dark" type="submit">'+ic("Check")+'Salvar</button></div></form></div>');
  bindToggles(); bindIcons();
  $("#fCat").onsubmit = function(e){
    e.preventDefault(); var titulo=$("#cT").value.trim(); if(!titulo) return;
    var o = cat || {};
    o.titulo=titulo; o.descricao=$("#cD").value.trim(); o.exibicao=$("#cE").value; o.icone=$("#fIc").value; o.ativo=$("#cA").getAttribute("aria-checked")==="true";
    if(isNew){ o.id=uid(titulo, DATA.categorias.map(function(x){ return x.id; })); o.ordem=DATA.categorias.reduce(function(m,x){ return Math.max(m,x.ordem); },0)+1; DATA.categorias.push(o); }
    closeLayer(); change(); toast(isNew?"Categoria criada.":"Categoria atualizada.");
  };
}

function cfgForm(){
  var c = DATA.config;
  openLayer('<div class="ov"><form class="modal" id="fCfg"><div class="modal-h"><h2>Cabeçalho e textos</h2><button type="button" class="x" data-close aria-label="Fechar">'+ic("X")+'</button></div><div class="modal-b">'+
    '<div class="cols">'+field("Sigla", '<input class="in" id="gS" value="'+esc(c.sigla)+'">')+field("Título", '<input class="in" id="gT" value="'+esc(c.titulo)+'">')+'</div>'+
    field("Descrição", '<textarea class="in" id="gD">'+esc(c.descricao)+'</textarea>')+
    '<div class="cols">'+field("Título dos destaques", '<input class="in" id="gH" value="'+esc(c.tituloDestaques)+'">')+field("Rodapé", '<input class="in" id="gR" value="'+esc(c.rodape)+'">')+'</div>'+
    '</div><div class="modal-f"><button type="button" class="btn btn-line" data-close>Cancelar</button><button class="btn btn-dark" type="submit">'+ic("Check")+'Salvar</button></div></form></div>');
  $("#fCfg").onsubmit = function(e){ e.preventDefault();
    c.sigla=$("#gS").value.trim()||"GG"; c.titulo=$("#gT").value.trim()||"Hub de Informações"; c.descricao=$("#gD").value.trim();
    c.tituloDestaques=$("#gH").value.trim()||"Mais acessados"; c.rodape=$("#gR").value.trim();
    closeLayer(); change(); toast("Cabeçalho atualizado."); };
}

/* ---------------- Publicar ---------------- */
function buildHtml(){
  var json = JSON.stringify(DATA, null, 2).replace(/<\//g, "<\\/");
  var start = "<!--HUB-DATA-START-->", end = "<!--HUB-DATA-END-->";
  var a = PRISTINE.indexOf(start), b = PRISTINE.indexOf(end);
  return PRISTINE.slice(0, a) + start + '<script type="application/json" id="hub-data">' + json + '<\/script>' + PRISTINE.slice(b);
}
function b64utf8(s){ var bytes = new TextEncoder().encode(s), bin = ""; for(var i=0;i<bytes.length;i+=8192){ bin += String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); } return btoa(bin); }

function publishForm(){
  var tok = ""; try{ tok = sessionStorage.getItem(TOKEN_KEY)||""; }catch(e){}
  var editUrl = "https://github.com/"+REPO.owner+"/"+REPO.repo+"/upload/"+REPO.branch+"/"+REPO.path.split("/").slice(0,-1).join("/");
  openLayer('<div class="ov"><div class="modal"><div class="modal-h"><h2>Publicar alterações</h2><button class="x" data-close aria-label="Fechar">'+ic("X")+'</button></div><div class="modal-b">'+
    '<div class="tabs"><button class="act" data-tab="a">Direto no GitHub</button><button data-tab="b">Sem token (manual)</button></div>'+
    '<div data-pane="a">'+
      '<div class="note">Salva o arquivo <b>'+esc(REPO.path)+'</b> no repositório <b>'+esc(REPO.owner+"/"+REPO.repo)+'</b>. O site atualiza sozinho em 1 a 3 minutos — o link continua o mesmo.</div>'+
      field("Token do GitHub", '<input class="in" id="pTok" type="password" autocomplete="off" placeholder="github_pat_…" value="'+esc(tok)+'">',
        'Crie em <a style="text-decoration:underline" target="_blank" rel="noopener" href="https://github.com/settings/personal-access-tokens/new">GitHub → Fine-grained tokens</a>: repositório <b>'+esc(REPO.repo)+'</b>, permissão <b>Contents: Read and write</b>. Fica salvo só nesta aba.')+
      field("Descrição da alteração", '<input class="in" id="pMsg" value="Atualiza Hub de Informações">')+
      '<button class="btn btn-dark" id="pGo" style="width:100%">'+ic("UploadCloud")+'Publicar agora</button><div id="pOut"></div>'+
    '</div>'+
    '<div data-pane="b" style="display:none"><div class="note"><ol>'+
      '<li>Clique em <b>Baixar HTML atualizado</b> (o arquivo se chama <b>hub.html</b>).</li>'+
      '<li>Clique em <b>Abrir pasta no GitHub</b>.</li>'+
      '<li>Arraste o arquivo baixado para a página e clique em <b>Commit changes</b>.</li></ol></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn btn-dark" id="pDl">'+ic("Download")+'Baixar HTML atualizado</button>'+
      '<a class="btn btn-line" target="_blank" rel="noopener" href="'+editUrl+'">'+ic("ExternalLink")+'Abrir pasta no GitHub</a></div>'+
    '</div></div></div></div>');
  document.querySelectorAll("#layer [data-tab]").forEach(function(b){ b.onclick=function(){
    document.querySelectorAll("#layer [data-tab]").forEach(function(x){ x.classList.toggle("act", x===b); });
    document.querySelectorAll("#layer [data-pane]").forEach(function(p){ p.style.display = p.getAttribute("data-pane")===b.getAttribute("data-tab")?"":"none"; });
  }; });
  $("#pDl").onclick = function(){
    var blob = new Blob([buildHtml()], {type:"text/html"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "hub.html"; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("hub.html baixado.");
  };
  $("#pGo").onclick = function(){
    var token = $("#pTok").value.trim(), out = $("#pOut"), btn = $("#pGo");
    if(!token){ out.innerHTML = '<div class="err">Cole o token do GitHub para publicar.</div>'; return; }
    try{ sessionStorage.setItem(TOKEN_KEY, token); }catch(e){}
    btn.disabled = true; out.innerHTML = '<div class="note" style="margin-top:10px">Publicando…</div>';
    var api = "https://api.github.com/repos/"+REPO.owner+"/"+REPO.repo+"/contents/"+REPO.path;
    var h = {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"};
    fetch(api+"?ref="+REPO.branch, {headers:h}).then(function(r){
      if(r.status===401) throw new Error("Token inválido ou expirado.");
      if(r.status===404) return {};
      if(!r.ok) throw new Error("Não foi possível ler o arquivo atual ("+r.status+").");
      return r.json();
    }).then(function(cur){
      var body = {message: $("#pMsg").value || "Atualiza Hub de Informações", content: b64utf8(buildHtml()), branch: REPO.branch};
      if(cur && cur.sha) body.sha = cur.sha;
      return fetch(api, {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, h), body:JSON.stringify(body)});
    }).then(function(r){
      if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(r.status===403||r.status===404 ? "O token não tem permissão de escrita neste repositório (precisa de Contents: Read and write)." : (j.message||("Erro "+r.status)));
      });
      PUBLISHED = clone(DATA); store(DRAFT_KEY, null); renderEdBar();
      out.innerHTML = '<div class="ok">Publicado! O site atualiza em 1 a 3 minutos. Recarregue a página depois disso.</div>';
    }).catch(function(err){ out.innerHTML = '<div class="err">'+esc(err.message||err)+'</div>'; })
      .then(function(){ btn.disabled = false; });
  };
}

/* ---------------- Início ---------------- */
if(location.hash==="#editar") enterEdit(); else render();
})();
</script>
